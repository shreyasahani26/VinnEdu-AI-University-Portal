services:
  - type: web
    name: VinnEdu-AI-University-Portal
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vinnedu-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: SEED_DEMO_DATA
        value: "0"

databases:
  - name: vinnedu-db
    databaseName: vinnedu_ai
    user: vinnedu_user
    plan: free
    region: oregon
    ipAllowList: []